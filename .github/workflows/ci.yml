name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/ingest-gateway/go.mod
          cache-dependency-path: services/ingest-gateway/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test with race detector
        run: go test -race ./...

      - name: Build gateway
        run: go build ./cmd/ingest-gateway

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build shared package
        run: npm run build -w @sentinelai/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test --workspaces --if-present
