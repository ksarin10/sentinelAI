services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinelai
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelai?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      API_PORT: 4000
      CORS_ORIGINS: http://localhost:3000
      RUN_CATALOG_SYNC_ON_START: ${RUN_CATALOG_SYNC_ON_START:-true}
      SHADOW_MIN_SAVINGS_USD: ${SHADOW_MIN_SAVINGS_USD:-0}
      SHADOW_REPLAY_MODE: ${SHADOW_REPLAY_MODE:-simulate}
      SHADOW_EARLY_STOP_FAILURES: ${SHADOW_EARLY_STOP_FAILURES:-5}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelai?schema=public
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EVAL_JUDGE_ENABLED: ${EVAL_JUDGE_ENABLED:-false}
      EVAL_JUDGE_MODEL: ${EVAL_JUDGE_MODEL:-gpt-4.1-mini}
      SHADOW_REPLAY_MODE: ${SHADOW_REPLAY_MODE:-simulate}
      SHADOW_EARLY_STOP_FAILURES: ${SHADOW_EARLY_STOP_FAILURES:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
